name: Auto Release

# 當推送特定格式的標籤時自動觸發
on:
  push:
    tags:
      - 'v*.*.*'  # 例如: v1.8.0, v2.0.0
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch  # 1.8.0 -> 1.8.1
          - minor  # 1.8.0 -> 1.9.0
          - major  # 1.8.0 -> 2.0.0
        default: 'patch'
      release_tag:
        description: 'Existing tag to republish (for partial release recovery, e.g. v2.2.8)'
        required: false
        type: string
        default: ''

jobs:
  # 先執行完整的 CI 測試
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install TA-Lib C library
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
        tar -xzf ta-lib-0.4.0-src.tar.gz
        cd ta-lib/
        ./configure --prefix=/usr
        make
        sudo make install

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools-scm
        pip install ./wheels/fubon_neo-2.2.8-cp37-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
        pip install pandas scipy "mcp>=2.0.0,<3.0.0" "pydantic>=2.12.0" python-dotenv TA-Lib
        pip install pytest pytest-cov pytest-xdist pytest-mock
        pip install flake8 black isort mypy pandas-stubs

    - name: Run linters
      continue-on-error: true
      run: |
        flake8 fubon_api_mcp_server tests --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check fubon_api_mcp_server tests --exclude fubon_api_mcp_server/_version.py
        isort --check-only fubon_api_mcp_server tests --skip fubon_api_mcp_server/_version.py
        mypy fubon_api_mcp_server

    - name: Run tests
      continue-on-error: true
      run: |
        pytest --cov=fubon_api_mcp_server --cov-report=xml --cov-fail-under=10

  # 計算新版本號
  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install setuptools-scm
      run: pip install setuptools-scm

    - name: Determine version
      id: version
      env:
        BUMP_TYPE: ${{ inputs.bump_type }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          # 從標籤獲取版本 (Git Tag is the single source of truth)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "✓ Using version from git tag: $VERSION"
        elif [ -n "$RELEASE_TAG" ]; then
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid release tag: $RELEASE_TAG"
            echo "   Expected format: vX.Y.Z (e.g., v2.2.8)"
            exit 1
          fi
          VERSION=${RELEASE_TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "✓ Republishing existing tag: $RELEASE_TAG"
        else
          # 從當前版本計算新版本
          CURRENT=$(python -c "import setuptools_scm; print(setuptools_scm.get_version())" | sed 's/\.post.*//' | sed 's/+.*//')
          echo "Current version: $CURRENT"
          
          IFS='.' read -r major minor patch <<< "$CURRENT"
          
          if [ "$BUMP_TYPE" = "major" ]; then
            NEW_VERSION="$((major + 1)).0.0"
          elif [ "$BUMP_TYPE" = "minor" ]; then
            NEW_VERSION="$major.$((minor + 1)).0"
          else
            NEW_VERSION="$major.$minor.$((patch + 1))"
          fi
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✓ New version: $NEW_VERSION"
        fi

    - name: Validate version format
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Invalid version format: $VERSION"
          echo "   Expected format: X.Y.Z (e.g., 2.3.0)"
          exit 1
        fi
        echo "✓ Version format valid: $VERSION"

    - name: Create and push tag
      if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag ${{ steps.version.outputs.tag }}
        git push origin ${{ steps.version.outputs.tag }}

    - name: Reuse existing tag
      if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
      run: echo "✓ Reusing existing tag ${{ steps.version.outputs.tag }}; no tag mutation performed"

  # 發布到 PyPI
  pypi-release:
    needs: version
    if: github.event_name == 'push' || inputs.release_tag == ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.version.outputs.tag }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools-scm

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        print-hash: true

  # 發布到 VS Code Marketplace
  vscode-release:
    needs: version
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CORE_OUTPUT: none

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.version.outputs.tag }}
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    - name: Azure login with Microsoft Entra workload identity
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        allow-no-subscriptions: true

    - name: Verify Azure DevOps Entra access token
      shell: bash
      run: |
        set -euo pipefail
        token="$(az account get-access-token \
          --resource 499b84ac-1321-427f-aa17-267ca6975798 \
          --query accessToken \
          --output tsv)"
        test -n "$token"
        echo "✓ Azure DevOps Entra access token acquired"

    - name: Update package.json version (from git tag)
      working-directory: ./vscode-extension
      run: |
        echo "📦 Syncing VS Code extension version from git tag..."
        echo "   Git tag version: ${{ needs.version.outputs.version }}"
        jq '.version = "${{ needs.version.outputs.version }}"' package.json > tmp.json && mv tmp.json package.json
        echo "✓ package.json updated to: $(jq -r '.version' package.json)"

    - name: Update version_config.json (from git tag)
      run: |
        echo "📦 Syncing version_config.json from git tag..."
        jq '.version.current = "${{ needs.version.outputs.version }}"' scripts/version_config.json > tmp.json && mv tmp.json scripts/version_config.json
        echo "✓ version_config.json updated to: $(jq -r '.version.current' scripts/version_config.json)"

    - name: Install dependencies
      working-directory: ./vscode-extension
      run: npm install

    - name: Install vsce
      run: npm install -g @vscode/vsce@3.9.2

    - name: Package extension
      working-directory: ./vscode-extension
      run: vsce package

    - name: Publish to VS Code Marketplace with Microsoft Entra ID
      working-directory: ./vscode-extension
      run: vsce publish --azure-credential

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v6
      with:
        name: vscode-extension-${{ needs.version.outputs.version }}
        path: vscode-extension/*.vsix
        retention-days: 90

  # 創建 GitHub Release
  github-release:
    needs: [version, pypi-release, vscode-release]
    if: >-
      always() && needs.version.result == 'success' && needs.vscode-release.result == 'success' &&
      (needs.pypi-release.result == 'success' || needs.pypi-release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Get previous tag
      id: prev_tag
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 ${{ needs.version.outputs.tag }}^ 2>/dev/null || echo "")
        echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

    - name: Generate changelog
      id: changelog
      run: |
        if [ -n "${{ steps.prev_tag.outputs.prev_tag }}" ]; then
          CHANGELOG=$(git log ${{ steps.prev_tag.outputs.prev_tag }}..${{ needs.version.outputs.tag }} --pretty=format:"- %s (%h)" --no-merges)
        else
          CHANGELOG=$(git log ${{ needs.version.outputs.tag }} --pretty=format:"- %s (%h)" --no-merges | head -20)
        fi
        
        # 保存到文件以避免多行問題
        echo "$CHANGELOG" > /tmp/changelog.txt

    - name: Download VSIX artifact
      uses: actions/download-artifact@v7
      with:
        name: vscode-extension-${{ needs.version.outputs.version }}
        path: ./artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.tag }}
        name: Release ${{ needs.version.outputs.tag }}
        body: |
          ## 🚀 Release ${{ needs.version.outputs.version }}
          
          ### 📦 Installation
          
          **PyPI (Python Package):**
          ```bash
          pip install --upgrade fubon-api-mcp-server==${{ needs.version.outputs.version }}
          ```
          
          **VS Code Extension:**
          - Search for "fubon-api-mcp-server" in VS Code Extensions
          - Or download the `.vsix` file below and install manually
          
          ### 📝 Changelog
          
          ${{ steps.changelog.outputs.changelog }}
          
          ### 🔗 Links
          - PyPI: https://pypi.org/project/fubon-api-mcp-server/${{ needs.version.outputs.version }}/
          - VS Code Marketplace: https://marketplace.visualstudio.com/items?itemName=mofesto.fubon-api-mcp-server
          - Documentation: https://github.com/${{ github.repository }}#readme
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.prev_tag }}...${{ needs.version.outputs.tag }}
        files: |
          ./artifacts/*.vsix
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 發送通知
  notify:
    needs: [version, github-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Release Summary
      run: |
        echo "### 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ needs.version.outputs.version }} (from git tag)" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** ${{ needs.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Version Synced To:" >> $GITHUB_STEP_SUMMARY
        echo "- Python package (via setuptools-scm)" >> $GITHUB_STEP_SUMMARY
        echo "- vscode-extension/package.json" >> $GITHUB_STEP_SUMMARY
        echo "- scripts/version_config.json" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Published to:" >> $GITHUB_STEP_SUMMARY
        echo "- 📦 PyPI: https://pypi.org/project/fubon-api-mcp-server/${{ needs.version.outputs.version }}/" >> $GITHUB_STEP_SUMMARY
        echo "- 🔌 VS Code Marketplace: https://marketplace.visualstudio.com/items?itemName=mofesto.fubon-api-mcp-server" >> $GITHUB_STEP_SUMMARY
        echo "- 🏷️ GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
